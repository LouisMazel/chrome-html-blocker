name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Zip extension
        run: cd dist && zip -r ../html-blocker-${{ github.ref_name }}.zip . -x '.vite/*'

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: html-blocker-${{ github.ref_name }}.zip
