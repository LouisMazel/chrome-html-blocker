<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>HTML Blocker</h1>
        <div class="toggle-container">
          <label class="switch">
            <input type="checkbox" id="extensionToggle" />
            <span class="slider"></span>
          </label>
          <span id="toggleLabel" class="toggle-label">Enabled</span>
        </div>
      </header>

      <div class="stats-banner">
        <div class="stats-content">
          <div class="stat-item">
            <div class="stat-value" id="totalBlocked">0</div>
            <div class="stat-label">Elements blocked</div>
          </div>
          <button id="resetStatsBtn" class="btn-reset" title="Reset statistics">Reset</button>
        </div>
      </div>

      <div class="sites-section">
        <div class="section-header">
          <h2>Configured Sites</h2>
          <button id="addSiteBtn" class="btn-primary">+ Add</button>
        </div>
        <div id="sitesList" class="sites-list"></div>
        <div id="emptyState" class="empty-state hidden">
          <p>No sites configured</p>
          <p class="empty-hint">Click "+ Add" to get started</p>
        </div>
      </div>

      <footer class="footer">
        <label class="checkbox-label checkbox-label--small">
          <input type="checkbox" id="debug-mode" />
          <span>Debug mode</span>
        </label>
      </footer>
    </div>

    <!-- Modal for adding/editing a site -->
    <div id="editModal" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content">
        <h3 id="modalTitle">Add Site</h3>
        <form id="siteForm">
          <div class="form-group">
            <label for="siteName">Site Name (optional)</label>
            <input type="text" id="siteName" placeholder="e.g., YouTube" autocomplete="off" />
          </div>

          <div class="form-group">
            <label for="urlPattern"> URL Pattern <span class="required">*</span> </label>
            <input type="text" id="urlPattern" required placeholder="e.g., *://www.example.com/*" autocomplete="off" />
            <small class="hint">Use * as wildcard for URLs</small>
          </div>

          <div class="form-group">
            <label for="selector">CSS Selector</label>
            <div class="selector-input-group">
              <input type="text" id="selector" placeholder="e.g., div.Modal[data-modal='block']" autocomplete="off" />
              <button type="button" id="pickElementBtn" class="btn-pick" title="Pick an element from the page">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 2L7 14L9 9L14 7L2 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
                  <path d="M9 9L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                Pick
              </button>
            </div>
            <small class="hint">CSS selector of elements to remove from the page</small>
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="forceScroll" />
              <span>Force scroll</span>
            </label>
            <small class="hint">Prevents the website from blocking page scrolling</small>
          </div>

          <div class="form-group">
            <label for="custom-css">Custom CSS <span class="advanced-label">advanced</span></label>
            <textarea
              id="custom-css"
              rows="3"
              placeholder="e.g., html.no-scroll { overflow: auto !important; }"
              autocomplete="off"
            ></textarea>
            <small class="hint">Raw CSS rules injected into the page</small>
          </div>

          <div class="form-error hidden" id="formError"></div>

          <div class="form-actions">
            <button type="button" id="cancelBtn" class="btn-secondary">Cancel</button>
            <button type="submit" class="btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Confirm Modal -->
    <div id="confirmModal" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content modal-dialog">
        <div class="modal-body">
          <p id="confirmMessage"></p>
        </div>
        <div class="modal-actions">
          <button id="confirmCancelBtn" class="btn-secondary">Cancel</button>
          <button id="confirmOkBtn" class="btn-primary">OK</button>
        </div>
      </div>
    </div>

    <!-- Alert Modal -->
    <div id="alertModal" class="modal hidden">
      <div class="modal-overlay"></div>
      <div class="modal-content modal-dialog">
        <div class="modal-body">
          <p id="alertMessage"></p>
        </div>
        <div class="modal-actions">
          <button id="alertOkBtn" class="btn-primary">OK</button>
        </div>
      </div>
    </div>

    <script type="module" src="popup.ts"></script>
  </body>
</html>
